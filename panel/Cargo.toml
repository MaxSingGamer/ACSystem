[package]
build = "build.rs"
name = "acs-panel"
version = "4.0.0"
edition = "2024"
description = "AlphaCoin 服务中心面板（Web）：多服务启停 / 日志 / AlphaTar 服务包"

[[bin]]
name = "AlphaCoinServerPanel"
path = "src/main.rs"

[build-dependencies]
# 嵌入面板图标（Windows 资源）
winresource = "0.1"

[dependencies]
acs-core = { path = "../core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.45"
anyhow = "1"
flate2 = "1"
aes-gcm = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11.0"
# v4.0.0（Panel #1）：面板登录 / TOTP / Passkey（WebAuthn）
sha1 = "0.10"
base64 = "0.22"
ciborium = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
