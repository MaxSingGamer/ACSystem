<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A€ 钱包</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#30363d;
    --fg:#e6edf3; --mut:#8b949e; --acc:#58a6ff; --acc2:#79c0ff;
    --ok:#3fb950; --warn:#d29922; --err:#f85149;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--fg); font-family:"Microsoft YaHei",system-ui,sans-serif; font-size:14px;}
  .hidden{display:none !important;}
  /* 顶部状态栏 */
  #topbar{display:flex; align-items:center; gap:16px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border);}
  #topbar .logo{font-weight:bold; font-size:15px;}
  #topbar .acc{color:var(--acc);}
  #topbar .right{margin-left:auto; color:var(--mut); display:flex; gap:16px; align-items:center;}
  #topbar .synced{color:var(--mut);}
  #topbar button{background:var(--panel2); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:5px 12px; cursor:pointer;}
  #topbar button:hover{background:#242d3a;}
  /* 布局 */
  #layout{display:flex; min-height:calc(100vh - 53px);}
  #nav{width:150px; background:var(--panel); border-right:1px solid var(--border); padding:10px 0;}
  #nav .item{padding:10px 18px; cursor:pointer; color:var(--mut);}
  #nav .item:hover{background:var(--panel2); color:var(--fg);}
  #nav .item.active{background:var(--panel2); color:var(--acc); font-weight:bold; border-left:3px solid var(--acc);}
  #main{flex:1; padding:16px;}
  /* 内容 */
  .card{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:12px;}
  .card h2{font-size:15px; color:var(--acc); margin-bottom:10px;}
  .bar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .btn{background:var(--acc); color:#0d1117; border:none; border-radius:6px; padding:7px 14px; font-size:13px; cursor:pointer; font-weight:bold;}
  .btn:hover{filter:brightness(1.1);}
  .btn.ghost{background:var(--panel2); color:var(--fg); border:1px solid var(--border); font-weight:normal;}
  .btn.danger{background:var(--err); color:#fff;}
  .btn.ok{background:var(--ok); color:#0d1117;}
  table{width:100%; border-collapse:collapse;}
  th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--border);}
  th{color:var(--mut); font-weight:normal;}
  .muted{color:var(--mut);}
  .balance{font-size:26px; font-weight:bold;}
  .balance span{color:var(--acc); font-size:15px;}
  .status{color:var(--ok);}
  .status.warn{color:var(--warn);}
  /* 弹窗 */
  #modal-wrap{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:50;}
  #modal{width:420px; max-width:92vw; max-height:88vh; overflow-y:auto; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px;}
  #modal h3{margin-bottom:14px; color:var(--acc);}
  #modal .field{margin-bottom:12px;}
  #modal label{display:block; color:var(--mut); margin-bottom:5px;}
  #modal input,#modal select{width:100%; background:var(--panel2); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:8px 10px;}
  #modal input:focus{outline:none; border-color:var(--acc);}
  #modal .row{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}
  #modal .error{color:var(--err); margin-top:8px; font-size:13px;}
  /* 登录/注册 */
  #auth{max-width:440px; margin:60px auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:26px;}
  #auth h1{font-size:18px; margin-bottom:18px; text-align:center;}
  #auth h1 span{color:var(--acc);}
  #auth .acc-item{padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; cursor:pointer;}
  #auth .acc-item.active{border-color:var(--acc); background:var(--panel2);}
  #auth .acc-item .t{font-weight:bold;}
  #auth .acc-item .d{color:var(--mut); font-size:12px; margin-top:3px;}
  #auth label{display:block; color:var(--mut); margin:12px 0 5px;}
  #auth input,#auth select{width:100%; background:var(--panel2); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:9px 11px;}
  #auth input:focus,#auth select:focus{outline:none; border-color:var(--acc);}
  #auth .err{color:var(--err); margin-top:8px; min-height:18px;}
  #auth .btns{display:flex; gap:8px; margin-top:14px;}
  #auth .btns .btn{flex:1;}
  .msgbox{position:fixed; top:70px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--acc); color:var(--fg); padding:10px 18px; border-radius:8px; z-index:99; box-shadow:0 4px 20px rgba(0,0,0,.4);}
  .msgbox.err{border-color:var(--err);}
</style>
</head>
<body>
<div id="topbar">
  <div class="logo">● A€ <span class="acc">钱包</span> <span class="muted" id="ver"></span></div>
  <div class="muted" id="user"></div>
  <div class="right">
    <span class="synced" id="syncstate"></span>
    <button id="btn-sync" class="hidden">同步</button>
    <button id="btn-logout" class="hidden">退出登录</button>
    <button id="btn-quit">退出程序</button>
  </div>
</div>

<div id="layout" class="hidden">
  <div id="nav"></div>
  <div id="main"></div>
</div>

<!-- 登录 / 注册 -->
<div id="auth">
  <h1>● A€ <span>钱包登录</span></h1>
  <div id="auth-body"></div>
  <div class="err" id="auth-err"></div>
</div>

<!-- 模态弹窗 -->
<div id="modal-wrap" class="hidden">
  <div id="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="error" id="modal-error"></div>
    <div class="row">
      <button class="btn ghost" id="modal-cancel">取消</button>
      <button class="btn ok" id="modal-ok">确定</button>
    </div>
  </div>
</div>

<div id="msgbox" class="hidden"></div>

<script>
const $ = (id) => document.getElementById(id);
const V = '2.0.0';
let state = { logged_in:false };
let view = 'home';
let selectedUid = null;

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTs(t){ if(!t) return '从未'; const d = new Date(t*1000); return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }

async function api(path, body, method){
  const m = method || (body ? 'POST' : 'GET');
  const opt = { method: m, headers:{'Content-Type':'application/json'} };
  if(body) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  return r.json();
}

function toast(msg, isErr){
  const m = $('msgbox');
  m.textContent = msg;
  m.className = 'msgbox' + (isErr ? ' err' : '');
  clearTimeout(m._t);
  m._t = setTimeout(()=> m.classList.add('hidden'), 4000);
}

// ---------- 渲染 ----------
function renderAuth(){
  const body = $('auth-body');
  if(state.logged_in){ $('auth').classList.add('hidden'); $('layout').classList.remove('hidden'); render(); return; }
  // 修复：未登录时也刷新顶部栏（隐藏用户信息/同步/退出按钮）
  renderTop();
  $('auth').classList.remove('hidden'); $('layout').classList.add('hidden');
  // 第一步：未配置中心服务器 → 先配置（留空默认 acsystem.maxshin.top）
  if(!state.server_url){
    body.innerHTML = `
      <p class="muted" style="text-align:center;margin-bottom:12px;">第一步 · 配置中心服务器</p>
      <label>中心服务器地址</label>
      <input id="auth-server" placeholder="https://acsystem.maxshin.top">
      <div class="muted" style="font-size:12px;margin:6px 0 2px;">留空则使用默认：https://acsystem.maxshin.top</div>
      <div class="btns"><button class="btn" id="auth-saveserver">保存并继续</button></div>`;
    $('auth-saveserver').onclick = async () => {
      const url = ($('auth-server').value || '').trim() || 'https://acsystem.maxshin.top';
      const r = await api('/api/set-server', { url });
      if(r.ok){ await refresh(); } else { $('auth-err').textContent = r.message; }
    };
    $('auth-err').textContent = '';
    return;
  }
  body.innerHTML = `
    <label>账户类型</label>
    <select id="auth-type" onchange="authTypeChange()">
      <option value="Individual">个人账户</option>
      <option value="Bank">银行账户</option>
      <option value="Country">国家账户</option>
      <option value="System">系统账户</option>
    </select>
    <div id="auth-uid-wrap"></div>
    <label>密码</label><input type="password" id="auth-pass" placeholder="≥8 位">
    <div class="btns">
      <button class="btn" id="auth-login">登录</button>
      <button class="btn ghost" id="auth-register">注册新账户</button>
    </div>`;
  authTypeChange();
  $('auth-login').onclick = async () => {
    const uid = ($('auth-uid').value || '').trim();
    const pass = $('auth-pass').value;
    if(!uid){ $('auth-err').textContent = '请输入或选择账户 UID'; return; }
    if(pass.length < 8){ $('auth-err').textContent = '密码至少 8 位'; return; }
    const r = await api('/api/login', { uid, password: pass });
    if(r.ok){ await refresh(); toast(r.message); } else { $('auth-err').textContent = r.message; }
  };
  $('auth-register').onclick = () => openModal('register', {});
  $('auth-err').textContent = '';
  // 成员列表就绪后刷新下拉选项
  loadMembersCache().then(authTypeChange);
}

function authTypeChange(){
  const sel = $('auth-type');
  const wrap = $('auth-uid-wrap');
  if(!sel || !wrap) return;
  const t = sel.value;
  if(t === 'Individual'){
    wrap.innerHTML = `<label>账户 UID</label><input id="auth-uid" placeholder="如 Steve">`;
  } else if(t === 'Bank'){
    const opts = (memberLists.banks || []).map(c => `<option>${esc(c)}</option>`).join('');
    wrap.innerHTML = `<label>银行名称（仅 AEU 已认定）</label><select id="auth-uid">${opts || '<option value="">（暂无已认定银行）</option>'}</select>`;
  } else if(t === 'Country'){
    const opts = (memberLists.countries || []).map(c => `<option>${esc(c)}</option>`).join('');
    wrap.innerHTML = `<label>国家名称（仅 AEU 已认定）</label><select id="auth-uid">${opts || '<option value="">（暂无已认定国家）</option>'}</select>`;
  } else if(t === 'System'){
    const opts = (memberLists.systems || []).map(c => `<option>${esc(c)}</option>`).join('');
    wrap.innerHTML = `<label>系统账户</label><select id="auth-uid">${opts || '<option value="">（暂无）</option>'}</select>`;
  }
}

function render(){
  renderTop();
  renderNav();
  renderMain();
}

function renderTop(){
  $('ver').textContent = 'v' + V;
  const u = state.logged_in ? `${state.uid} · ${state.atype}` : '';
  $('user').textContent = u;
  $('syncstate').textContent = state.logged_in ? (state.synced_at ? `已同步 ${fmtTs(state.synced_at)}` : '未同步') : '';
  $('btn-sync').classList.toggle('hidden', !state.logged_in);
  $('btn-logout').classList.toggle('hidden', !state.logged_in);
}

const MENU = [
  ['home','首页'], ['accounts','账户信息'], ['txs','交易记录'],
  ['outbox','待提交'], ['settings','设置']
];
const ACTIONS = {
  home: [['sync','同步'],['transfer','转账'],['refresh','刷新']],
  accounts: [['sync','同步'],['switch','切换账户'],['register','注册新账户'],['delete','注销账户']],
  txs: [['transfer','转账'],['confirm','确认收款'],['submit','提交待确认']],
  outbox: [['submit','全部提交'],['refresh','刷新']],
  settings: [['setserver','中心地址'],['logout','返回登录']]
};

function renderNav(){
  const nav = $('nav');
  nav.innerHTML = MENU.map(([k,label]) =>
    `<div class="item ${k===view?'active':''}" data-view="${k}">${label}</div>`
  ).join('') + `<div class="item" id="nav-quit">退出程序</div>`;
  nav.querySelectorAll('.item[data-view]').forEach(el => {
    el.onclick = () => { view = el.dataset.view; render(); };
  });
  $('nav-quit').onclick = () => quitApp();
}

function renderMain(){
  const main = $('main');
  const actions = (ACTIONS[view] || []).map(([id,label]) =>
    `<button class="btn ghost" data-act="${id}">${label}</button>`).join('');
  const actionsBar = `<div class="bar">${actions}</div>`;
  let content = '';
  if(view === 'home') content = renderHome();
  else if(view === 'accounts') content = renderAccounts();
  else if(view === 'txs') content = renderTxs();
  else if(view === 'outbox') content = renderOutbox();
  else if(view === 'settings') content = renderSettings();
  main.innerHTML = actionsBar + content;
  main.querySelectorAll('button[data-act]').forEach(b => {
    b.onclick = () => runAction(b.dataset.act);
  });
}

function renderHome(){
  return `<div class="card"><h2>账户余额（中心口径）</h2>
    <div class="balance">${state.balance} <span>A€</span></div>
    <p class="muted" style="margin-top:12px;">UID：${esc(state.uid)}<br>类型：${esc(state.atype)}<br>邮箱：${esc(state.email)}<br>中心：${esc(state.server_url || '未配置')}</p>
  </div>`;
}

function renderAccounts(){
  return `<div class="card"><h2>我的账户信息</h2>
    <table>
      <tr><th>UID</th><td>${esc(state.uid)}</td></tr>
      <tr><th>账户类型</th><td>${esc(state.atype)}</td></tr>
      <tr><th>邮箱</th><td>${esc(state.email)}</td></tr>
      <tr><th>余额（中心口径）</th><td>${state.balance} A€</td></tr>
      <tr><th>中心服务器</th><td>${esc(state.server_url || '未配置')}</td></tr>
      <tr><th>最近同步</th><td>${state.synced_at ? fmtTs(state.synced_at) : '从未'}</td></tr>
    </table>
  </div>`;
}

function renderTxs(){
  if(!state.txs || state.txs.length===0) return '<div class="card muted">暂无交易。同步后可见。</div>';
  const rows = state.txs.map(t => {
    const [id,type,peer,,amount,ts,status] = t;
    const cls = status==='Confirmed'?'status':(status==='Rejected'?'status warn':'status warn');
    return `<tr><td>${fmtTs(ts)}</td><td>${esc(type)}</td><td>${esc(peer)}</td><td>${amount}</td><td class="${cls}">${esc(status)}</td></tr>`;
  }).join('');
  return `<div class="card"><h2>交易记录</h2><table><tr><th>时间</th><th>类型</th><th>对方</th><th>金额</th><th>状态</th></tr>${rows}</table></div>`;
}

function renderOutbox(){
  if(!state.outbox || state.outbox.length===0) return '<div class="card muted">待提交列表为空。</div>';
  const rows = state.outbox.map(o => `<tr><td>${esc(o[0])}</td><td>${esc(o[1])}</td><td>${o[2]} A€</td></tr>`).join('');
  return `<div class="card"><h2>待提交（本地签名，未入账）</h2><table><tr><th>交易 ID</th><th>接收方</th><th>金额</th></tr>${rows}</table></div>`;
}

function renderSettings(){
  return `<div class="card"><h2>设置</h2>
    <table>
      <tr><th>中心服务器</th><td>${esc(state.server_url || '未配置')}</td></tr>
      <tr><th>数据目录</th><td>~/.alpha_dir/acs-client</td></tr>
    </table>
    <p class="muted" style="margin-top:12px;">本页包含：修改中心服务器地址、返回登录。<br>账户注销请前往「账户信息」页操作（危险操作）。</p>
  </div>`;
}

async function runAction(act){
  if(act==='sync'){ const r = await api('/api/sync', null, 'POST'); toast(r.message||'同步完成', !r.ok); await refresh(); }
  else if(act==='transfer') openModal('transfer', {});
  else if(act==='confirm') openModal('confirm', {});
  else if(act==='submit'){ const r = await api('/api/submit', null, 'POST'); toast(r.message||'提交完成', !r.ok); await refresh(); }
  else if(act==='refresh') await refresh();
  else if(act==='register') openModal('register', {});
  else if(act==='setserver') openModal('setserver', { url: state.server_url });
  else if(act==='delete') openModal('close', {});
  else if(act==='switch' || act==='logout'){ await api('/api/logout', null, 'POST'); await refresh(); }
}

// ---------- 模态弹窗 ----------
let memberLists = { countries: [], banks: [], systems: [] };
async function loadMembersCache(){
  try { const r = await api('/api/members'); memberLists = { countries: r.countries || [], banks: r.banks || [], systems: r.systems || [] }; }
  catch(e){ memberLists = { countries: [], banks: [], systems: [] }; }
}
function regNameField(){
  const t = $('r-type').value, wrap = $('r-name-wrap');
  if(t === 'Country'){
    const opts = memberLists.countries.map(c => `<option>${esc(c)}</option>`).join('');
    wrap.innerHTML = `<label>国家名称（仅 AEU 已认定）</label><select id="r-uid">${opts || '<option value="">（暂无已认定国家）</option>'}</select>`;
  } else if(t === 'Bank'){
    const opts = memberLists.banks.map(c => `<option>${esc(c)}</option>`).join('');
    wrap.innerHTML = `<label>银行名称（仅 AEU 已认定）</label><select id="r-uid">${opts || '<option value="">（暂无已认定银行）</option>'}</select>`;
  } else {
    wrap.innerHTML = `<label>UID（唯一识别符）</label><input id="r-uid" placeholder="如 Steve">`;
  }
}
function renderRegisterModal(){
  const body = $('modal-body'), err = $('modal-error');
  body.innerHTML = `
    <div class="field"><label>账户类型</label><select id="r-type" onchange="regNameField()">
      <option value="Individual">个人账户</option>
      <option value="Bank">银行账户</option>
      <option value="Country">国家账户</option>
    </select></div>
    <div class="field" id="r-name-wrap"></div>
    <div class="field"><label>邮箱</label><input id="r-email" placeholder="如 Steve@maxshin.top"></div>
    <div class="field"><label>口令（≥8 位，用于签名与登录取回）</label><input id="r-pass" type="password"></div>`;
  regNameField();
  err.textContent = '';
  $('modal-ok').onclick = async () => {
    const uid = ($('r-uid').value || '').trim();
    const r = await api('/api/register', { server_url:'', uid, type:$('r-type').value, email:$('r-email').value, password:$('r-pass').value });
    if(r.ok){ closeModal(); toast(r.message); refresh(); } else err.textContent = r.message;
  };
  $('modal-cancel').onclick = closeModal;
}

function openModal(kind, data){
  const title = $('modal-title'), body = $('modal-body'), err = $('modal-error');
  err.textContent = '';
  if(kind==='register'){
    $('modal-title').textContent = '注册新账户';
    body.innerHTML = '<p class="muted">正在加载已认定成员列表…</p>';
    $('modal-wrap').classList.remove('hidden');
    loadMembersCache().then(() => renderRegisterModal());
    return;
  }
  let html = '';
  if(kind==='transfer'){
    html = `<div class="field"><label>接收方 UID（可带 @类型）</label><input id="f-to" placeholder="如 Steve 或 AlphaEU@System"></div>
      <div class="field"><label>金额（A€）</label><input id="f-amt" type="number" min="1" placeholder="0"></div>
      <div class="field"><label>钱包口令</label><input id="f-pass" type="password" placeholder="≥8 位"></div>`;
  } else if(kind==='confirm'){
    html = `<div class="field"><label>钱包口令</label><input id="f-pass" type="password" placeholder="≥8 位"></div>
      <p class="muted">将确认接收方收到的第一笔待确认交易。</p>`;
  } else if(kind==='setserver'){
    html = `<div class="field"><label>中心地址</label><input id="f-url" placeholder="https://acsystem.maxshin.top" value="${esc(data.url||'')}"></div>`;
  } else if(kind==='close'){
    html = `<div class="field" style="color:#f85149;font-weight:bold;">⚠ 注销账户（不可撤销）</div>
      <p class="muted" style="margin-bottom:12px;">注销后：中心账户状态改为「已注销」，账户信息与账本变为只读（保留供审计），<b>不可再登录</b>；本机记录与密钥将被删除。</p>
      <div class="field"><label>输入钱包口令以确认注销</label><input id="f-pass" type="password" placeholder="≥8 位"></div>`;
  }
  $('modal-title').textContent = kind==='transfer'?'转账':(kind==='confirm'?'确认收款':(kind==='setserver'?'设置中心地址':'注销账户'));
  body.innerHTML = html;
  $('modal-wrap').classList.remove('hidden');
  const ok = $('modal-ok'), cancel = $('modal-cancel');
  ok.onclick = async () => {
    if(kind==='transfer'){
      const r = await api('/api/transfer', { to:$('f-to').value, amount:parseInt($('f-amt').value||'0'), password:$('f-pass').value });
      if(r.ok){ closeModal(); toast(r.message); await refresh(); } else err.textContent = r.message;
    } else if(kind==='confirm'){
      const r = await api('/api/confirm', { password:$('f-pass').value });
      if(r.ok){ closeModal(); toast(r.message); await refresh(); } else err.textContent = r.message;
    } else if(kind==='setserver'){
      const r = await api('/api/set-server', { url:$('f-url').value });
      if(r.ok){ closeModal(); toast(r.message); await refresh(); } else err.textContent = r.message;
    } else if(kind==='close'){
      const r = await api('/api/delete-account', { password:$('f-pass').value });
      if(r.ok){ closeModal(); toast(r.message); await refresh(); } else err.textContent = r.message;
    }
  };
  cancel.onclick = closeModal;
}
function closeModal(){ $('modal-wrap').classList.add('hidden'); }

// ---------- 顶部按钮 ----------
$('btn-sync').onclick = async () => { const r = await api('/api/sync', null, 'POST'); toast(r.message||'同步完成', !r.ok); await refresh(); };
$('btn-logout').onclick = async () => { await api('/api/logout', null, 'POST'); await refresh(); };
$('btn-quit').onclick = () => quitApp();
async function quitApp(){ try{ await fetch('/api/quit', {method:'POST'}); }catch(e){} setTimeout(()=>{ document.body.innerHTML='<div style="padding:40px;text-align:center;color:#8b949e">已退出。</div>'; }, 300); }

async function refresh(){
  state = await api('/api/state');
  renderAuth();
  if(!state.logged_in) renderAuth();
}
function heartbeat(){
  setInterval(()=>{ try{ fetch('/api/heartbeat',{method:'POST'}); }catch(e){} }, 5000);
}

$('ver').textContent = 'v' + V;
heartbeat();
refresh();
</script>
</body>
</html>
