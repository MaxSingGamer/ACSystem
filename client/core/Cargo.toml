[package]
name = "acs-client-core"
version = "4.0.0"
edition = "2024"
description = "A€（Alpha Coin）客户端业务核心：钱包/账本/网络/gpg；供 QT 客户端（DLL）与 AlphaCoinClientCli 共用"

[lib]
name = "acs_client_core"
# rlib：供 AlphaCoinClientCli 依赖；
# cdylib：产出 acs_client_core.dll 供 Qt/C++ 通过 C ABI 调用（D12）。
crate-type = ["rlib", "cdylib"]

[dependencies]
acs-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
chrono = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
anyhow = "1"
