# ============================================================
#  A€ Alpha Coin System — nginx 反向代理（TLS 加密传输）
#  前端 HTTPS :443  →  后端 acs-server :8080
#
#  用途：在 acs-server 之前放置 nginx，终止 TLS，使
#  acs-client / acs-mirror / 浏览器均通过 HTTPS 访问，防窃听。
#
#  Windows 部署：
#    1) 下载 nginx for Windows 并解压
#    2) 生成证书（见 README.md）
#    3) 将本文件改名为 nginx/conf/nginx.conf（或 include）
#    4) 修改下方 server_name 与证书路径
#    5) nginx.exe 启动（勿以管理员运行；用 conf 指定目录）
# ============================================================

worker_processes  2;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;   # 隐藏 nginx 版本号

    # ---------- HTTP :80 → HTTPS 跳转 ----------
    server {
        listen       80;
        server_name  acs.example.org;   # ← 改为你的域名/IP
        return 301 https://$host$request_uri;
    }

    # ---------- HTTPS :443（TLS 终止） ----------
    server {
        listen       443 ssl;
        http2        on;
        server_name  acs.example.org;   # ← 改为你的域名/IP

        # 证书（AutoTLS 自动生成：运行 deploy/certs/generate.ps1；或正式证书）
        # 路径请改为实际部署位置；示例指向仓库 deploy/certs/
        ssl_certificate      D:/Programs/Economy/ACSystem/deploy/certs/cert.pem;
        ssl_certificate_key  D:/Programs/Economy/ACSystem/deploy/certs/key.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        # 请求体上限（后端已限 4MB，这里 5MB 兜底）
        client_max_body_size 5m;

        # 安全响应头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        proxy_hide_header    Server;

        # 反代到 acs-server 公开 API（client/mirror 端口 9600）
        location / {
            proxy_pass         http://127.0.0.1:9600;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
