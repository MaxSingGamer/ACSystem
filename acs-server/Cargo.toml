[package]
name = "acs-server"
version = "1.0.5"
edition = "2024"

[[bin]]
name = "acs-server"
path = "src/main.rs"

[dependencies]
acs-core = { path = "../acs-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "limit", "timeout", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = "0.4.45"
sha2 = "0.11.0"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
anyhow = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "native-tls"] }
aes-gcm = "0.10"
rand = "0.8"
