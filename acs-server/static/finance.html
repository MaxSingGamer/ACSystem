<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Coin · 金融部</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand"><span class="logo"></span>Alpha Coin <span class="muted" style="font-weight:400">· 金融部</span></div>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button class="link-btn" onclick="showChg()">修改密码</button>
    <button class="link-btn" onclick="logout()">退出</button>
  </div>
</header>

<div class="layout">
  <div class="sections">
    <div class="section-tab on" data-s="ov" onclick="sec('ov')">状态</div>
    <div class="section-tab" data-s="acc" onclick="sec('acc')">银行账户</div>
    <div class="section-tab" data-s="mem" onclick="sec('mem')">成员企业</div>
    <div class="section-tab" data-s="aud" onclick="sec('aud')">审计</div>
  </div>

  <div class="section on" id="s-ov">
    <div class="cards">
      <div class="card"><div class="k">当日流水</div><div class="v" id="sToday">–</div></div>
      <div class="card"><div class="k">当日笔数</div><div class="v" id="sTodayC">–</div></div>
      <div class="card"><div class="k">累计流水</div><div class="v" id="sTotal">–</div></div>
      <div class="card"><div class="k">累计笔数</div><div class="v" id="sTotalC">–</div></div>
    </div>
    <div class="panel">
      <h2>每日流水走势</h2>
      <div class="row">
        <button class="btn-secondary btn-sm" onclick="loadDaily(7)">近一周</button>
        <button class="btn-secondary btn-sm" onclick="loadDaily(30)">近一月</button>
        <button class="btn-secondary btn-sm" onclick="loadDaily(365)">近一年</button>
      </div>
      <div class="chart" id="dailyChart"></div>
    </div>
  </div>

  <div class="section" id="s-acc">
    <div class="panel">
      <h2>银行账户（Bank）</h2>
      <div class="row">
        <input id="accSearch" placeholder="搜索 UID" style="width:220px" onkeydown="if(event.key==='Enter')loadAccounts()">
        <button class="btn-primary btn-sm" onclick="loadAccounts()">查询</button>
      </div>
      <table><thead><tr><th>UID</th><th>邮箱</th><th>余额</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="accBody"></tbody></table>
    </div>
  </div>

  <div class="section" id="s-mem">
    <div class="panel">
      <h2>成员企业注册表</h2>
      <div class="row">
        <input id="mName" placeholder="企业名称" style="width:260px">
        <button class="btn-primary btn-sm" onclick="addCompany()">注册</button>
      </div>
      <table><thead><tr><th>ID</th><th>名称</th><th>状态</th></tr></thead>
      <tbody id="memBody"></tbody></table>
    </div>
  </div>

  <div class="section" id="s-aud">
    <div class="panel" id="audLockPanel">
      <h2>交易总账单（需密码解锁）</h2>
      <div class="row">
        <input id="audPwd" type="password" placeholder="当前登录密码" style="width:220px">
        <button class="btn-primary btn-sm" onclick="unlockAudit()">解锁查看</button>
      </div>
      <div class="msg" id="audMsg"></div>
    </div>
    <div class="panel hidden" id="billPanel">
      <h2>交易总账单</h2>
      <div class="row">
        <input id="billDate" placeholder="日期 YYYY-MM-DD" style="width:160px">
        <button class="btn-primary btn-sm" onclick="loadBills()">查询</button>
      </div>
      <table><thead><tr><th>时间</th><th>类型</th><th>发送方</th><th>接收方</th><th>金额</th><th>状态</th><th>中心签名</th></tr></thead>
      <tbody id="billBody"></tbody></table>
    </div>
  </div>
</div>

<div class="hidden" id="chgPanel" style="position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50">
  <div class="login-card" style="margin:0">
    <h1>修改密码</h1>
    <label>原密码</label><input id="cOld" type="password">
    <label>新密码（≥8 位）</label><input id="cNew" type="password">
    <button class="btn-primary" style="width:100%;margin-top:16px" onclick="doChg()">确认修改</button>
    <div class="msg" id="cMsg"></div>
    <button class="link-btn" style="width:100%;margin-top:8px" onclick="$('chgPanel').classList.add('hidden')">取消</button>
  </div>
</div>

<script src="/static/js/common.js"></script>
<script src="/static/js/finance.js"></script>
</body>
</html>
