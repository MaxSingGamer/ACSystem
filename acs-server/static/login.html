<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Coin · 登录</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <span class="logo"></span>
    <h1>Alpha Coin</h1>
    <div class="sub">Center Administration · 中心管理</div>
    <div id="loginForm">
      <label for="uid">账号（UID）</label>
      <input id="uid" placeholder="如 max_shin" autocomplete="username">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn-primary" onclick="doLogin()">登 录</button>
      <div class="msg" id="loginMsg"></div>
    </div>
    <div id="chgForm" class="hidden">
      <div class="login-hint">首次登录须修改密码（≥8 位），修改后使用新密码登录。</div>
      <label for="np">新密码</label>
      <input id="np" type="password" placeholder="新密码（≥8 位）">
      <button class="btn-primary" onclick="doChange()">修改并重新登录</button>
      <div class="msg" id="chgMsg"></div>
    </div>
  </div>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
